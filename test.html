<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scalable Image Carousel</title>
</head>
<style>
    .carousel-container {
    position: relative;
    max-width: 800px;
    margin: 0 auto;
    overflow: hidden;
    }

    .carousel {
        display: flex;
        transition: transform 0.5s ease-in-out;
    }

    .carousel img {
        width: 100%;
        flex-shrink: 0;
        object-fit: cover;
    }

    .carousel-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        padding: 10px 15px;
        cursor: pointer;
        font-size: 18px;
        z-index: 10;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .prev-btn {
        left: 10px;
    }

    .next-btn {
        right: 10px;
    }

    .carousel-btn:hover {
        background: rgba(0, 0, 0, 0.8);
    }
</style>
<body>
    <div class="carousel-container">
        <div class="carousel">
            <!-- Add as many images as you want here -->
            <img src="images/pic01.jpg" alt="Image 1">
            <img src="images/pic02.jpg" alt="Image 2">
            <img src="images/pic03.jpg" alt="Image 3">
            <!-- Add more images as needed -->
        </div>
        <button class="carousel-btn prev-btn">&lt;</button>
        <button class="carousel-btn next-btn">&gt;</button>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
        const carousel = document.querySelector('.carousel');
        const images = document.querySelectorAll('.carousel img');
        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');
        
        let currentIndex = 0;
        const imageWidth = images[0].clientWidth;
        
        // Set initial position
        updateCarousel();
        
        // Next button click handler
        nextBtn.addEventListener('click', function() {
            currentIndex = (currentIndex + 1) % images.length;
            updateCarousel();
        });
        
        // Previous button click handler
        prevBtn.addEventListener('click', function() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateCarousel();
        });
        
        // Auto-advance every 5 seconds (optional)
        let autoSlide = setInterval(() => {
            currentIndex = (currentIndex + 1) % images.length;
            updateCarousel();
        }, 5000);
        
        // Pause auto-advance on hover
        carousel.addEventListener('mouseenter', () => {
            clearInterval(autoSlide);
        });
        
        // Resume auto-advance when mouse leaves
        carousel.addEventListener('mouseleave', () => {
            autoSlide = setInterval(() => {
                currentIndex = (currentIndex + 1) % images.length;
                updateCarousel();
            }, 5000);
        });
        
        // Handle window resize
        window.addEventListener('resize', function() {
            const newImageWidth = images[0].clientWidth;
            carousel.style.transform = `translateX(-${currentIndex * newImageWidth}px)`;
        });
        
        // Update carousel position
        function updateCarousel() {
            const currentWidth = images[0].clientWidth;
            carousel.style.transform = `translateX(-${currentIndex * currentWidth}px)`;
        }
        });
    </script>
</body>
</html>
